services:

  database:
    image: mysql:8.4
    container_name: mysql_database
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-systemdb}
      MYSQL_USER: ${MYSQL_USER:-systemuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

    volumes:
      - mysql_data:/var/lib/mysql


  backend:
    build: ./backend
    container_name: flask_backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-systemdb}
      MYSQL_USER: ${MYSQL_USER:-systemuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app

    depends_on:
      database:
        condition: service_healthy


  frontend:
    build: ./frontend
    container_name: react_frontend
    restart: unless-stopped

    ports:
      - "5174:5174"

    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000


volumes:
  mysql_data:
